#This YAML file is a Docker Compose configuration file used to define and manage multi-container Docker applications

version: '3.8' #This specifies the version of the Docker Compose file format being used. In this case, version 3.8.
services: #A service type could be a database, webserver or any other task. It Defines the services (containers) that make up your application. a service is like a job or role that a container performs. It could be running a web server, a database, or any other specific task
  postgreservice: #PostgreSQL service named "db"
    container_name: postgres_container #name of the container
    image: postgres #Specifies which docker image to use. Docker has images for various applications
    restart: always
    environment: #Sets environment variables for the PostgreSQL container, such as the database name, username, password, and data directory.
      POSTGRES_DB: healthcare_db #This sets the name of the default database that will be created inside the PostgreSQL container. In this case, it is set to "postgres_db". When the PostgreSQL container starts, it will create a database with this name. More databases can be then added and created via the web interface.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: *****
      PGDATA: /var/lib/postgresql/data
    ports: #Maps the host machine's port 5432 to the container's port 5432, allowing you to access the PostgreSQL service from the host
      - "5432:5432"
    volumes: #Defines named volumes (db-data and ./Design_Project) to persist data. 
      - db-data:/var/lib/postgresql/data #The first volume (db-data) stores the PostgreSQL data
      - ./Design_Project:/docker-entrypoint-initdb.d #This allows you to initialize the database with scripts located in the local ./Apple_case directory. This folder gets created automatically when you run docker compose up so make sure to use a good volume name.
    # ^ Maps the Apple_case directory to the container's init directory
  
  pgadminservice:
    container_name: pgadmin4_container
    image: dpage/pgadmin4:8.2
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: *****
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin #Defines a named volume (pgadmin-data) to persist pgAdmin data.

volumes: #Defines the named volumes (db-data and pgadmin-data) that were used in the volumes section of the services. These volumes are used to persist data across container restarts.
  db-data:
  pgadmin-data:
